
<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Matematikos praktika</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">

    <!-- KaTeX -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>

    <!-- JavaScript -->
    <script defer src="questions.js"></script>
    <script defer src="app.js"></script>
</head>

<body>
    <main class="wrap">

        <!-- Pagrindinė antraštė -->
        <header>
            <div class="brand">
                <span class="symbol">∑</span>
                <span>MATEMATIKOS PRAKTIKA</span>
            </div>

            <h1>Mokykis. Spręsk. Tobulėk.</h1>
            <p class="subtitle">Pasirink klasę, kursą ir temą.</p>
        </header>

        <!-- Kursų pasirinkimas -->
        <section class="card">
            <h2>Pasirink kursą</h2>

            <div class="course-grid" id="courses"></div>

            <div class="summary" id="overall"></div>
        </section>

        <!-- Matematikos temos -->
        <section class="card">
            <div class="split">
                <h2>Temos</h2>

                <button class="quiet" id="reset">
                    Ištrinti progresą
                </button>
            </div>

            <div id="topics" class="topics"></div>
        </section>

        <!-- Uždavinių sprendimas -->
        <section class="card quiz-card">

            <!-- Pasirinkta tema ir progresas -->
            <div class="split">
                <div>
                    <div id="breadcrumb" class="eyebrow"></div>
                    <h2 id="topic-title">Pasirink temą</h2>
                </div>

                <span id="progress-percent" class="percent"></span>
            </div>

            <!-- Progreso juosta -->
            <div class="bar">
                <div id="progress-bar"></div>
            </div>

            <p id="progress-text" class="muted"></p>

            <!-- Pradinis pranešimas -->
            <div id="empty" class="empty">
                Pasirink temą iš sąrašo.
            </div>

            <!-- Uždavinio turinys -->
            <div id="question-content" hidden>

                <div class="eyebrow" id="counter"></div>

                <h3 id="question"></h3>

                <!-- Atsakymų variantai -->
                <div id="options" class="options"></div>

                <!-- Veiksmų mygtukai -->
                <div class="actions">
                    <button id="check" class="primary" disabled>
                        Patikrinti atsakymą
                    </button>

                    <button id="next" class="primary" hidden>
                        Kitas uždavinys →
                    </button>
                </div>

                <!-- Atsakymo rezultatas -->
                <p id="feedback" role="status"></p>

            </div>
        </section>

        <!-- Puslapio apačia -->
        <footer>
            Matematikos praktika
        </footer>

    </main>
</body>

</html>
